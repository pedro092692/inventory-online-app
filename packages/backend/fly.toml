# fly.toml app configuration file generated for nexastock-api on 2026-09-02T16:51:10+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nexastock-api'
primary_region = 'iad'

[deploy]
  # Runs `sequelize-cli db:migrate` (the "public" schema migrations — roles, users, stores,
  # etc.) once, using this same image + secrets, before each deploy switches traffic to the
  # new version. Tenant-schema migrations still run on their own, per-tenant, inside the app
  # (see TenantConnection) — this is only for the shared public schema.
  release_command = 'npm run migrate'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
