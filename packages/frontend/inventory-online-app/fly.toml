# fly.toml app configuration file generated for nexastock-app on 2026-09-02T17:09:01+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nexastock-app'
primary_region = 'iad'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

[build.args]
  NEXT_PUBLIC_API_BASE_URL = "https://api.nexa-stock.com"
  NEXT_PUBLIC_DASHBOARD = "/store"
  NEXT_PUBLIC_WHATSAPP_NUMBER = "+34690279281"
  NEXT_PUBLIC_STORE_CREDIT_ID = "99"
